# Baguettotron-321M Smoke Test - HuggingFace Integration Test
# Fast test (~1-2 minutes) that validates HuggingFace dataset loading
#
# Purpose: Test HuggingFace integration without waiting 10 minutes
# - Uses tiny Wikipedia sample (50 examples)
# - Tests full pipeline: download → tokenize → train
# - Cache created for future runs

model:
  config: "321m"

data:
  datasets:
    # Local datasets (instant)
    - name: "smoke_test_main"
      weight: 0.5
      path: "data/smoke_test.json"
      max_samples: null

    # HuggingFace dataset (fast - only 50 samples)
    - name: "wikipedia_en_tiny"
      source: "huggingface"
      dataset_name: "wikimedia/wikipedia"
      subset: "20231101.en"
      split: "train"
      weight: 0.5
      max_samples: 50              # ⚡ FAST: 50 samples = ~15 seconds tokenization

  max_length: 512                  # Shorter for faster processing
  block_size: 512
  shuffle: true
  num_workers: 4

training:
  epochs: 1
  max_steps: 50                    # Quick test
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler: "cosine"
  warmup_steps: 10
  min_lr: 1.0e-6
  optimizer: "adamw"
  weight_decay: 0.1
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  logging_steps: 10
  eval_steps: 25
  save_steps: 25
  device: "cuda"
  grad_checkpointing: true

checkpoint:
  save_steps: 25
  save_total_limit: 2
  output_dir: "outputs/baguettotron_321m_smoke_test_hf"
  save_safetensors: true
  save_optimizer_states: true

evaluation:
  eval_dataset: "data/smoke_test_valid.json"
  eval_batch_size: 2
  compute_metrics: true

monitoring:
  use_tensorboard: false  # Disabled for speed
  use_wandb: false

hardware:
  gradient_checkpointing: true
  cudnn_benchmark: true

reproducibility:
  seed: 42

# ============================================================================
# TEST VALIDATION
# ============================================================================
#
# ✅ TESTS:
# 1. HuggingFace dataset download (if not cached)
# 2. Tokenization with progress bar (50 examples = ~15 seconds)
# 3. Dataset mixing (local + HuggingFace)
# 4. Training pipeline (50 steps = ~30 seconds)
# 5. Cache creation (~/.cache/baguettotron/datasets/wikipedia_en_tiny_train.json)
#
# EXPECTED TIME:
# - First run: ~1-2 minutes (download + tokenize + train)
# - Second run: ~30 seconds (uses cache)
#
# USAGE:
# ./baguettotron train --config-file configs/train_321m_smoke_test_hf.yaml
