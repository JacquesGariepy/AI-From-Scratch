# Uncomment the model overrides above:
# - num_hidden_layers: 12 (instead of 80)
# - hidden_size: 384 (instead of 576)
# Result: ~30M parameters instead of 321M
# Time: 2-3 minutes instead of 5-10 minutes
#
# MORE COMPLETE SMOKE TEST (more steps):
# Modify:
# - max_steps: 500 (instead of 100)
# - eval_steps: 100
# - test_every_n_steps: 100
# Duration: 20-30 minutes
# Better convergence verification
