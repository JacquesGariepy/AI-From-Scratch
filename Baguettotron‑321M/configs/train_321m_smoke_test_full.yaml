# Baguettotron-321M Full Smoke Test Configuration
# Comprehensive pipeline test with ALL features enabled
# Complete test in 20-30 minutes
#
# Purpose: Test EVERY feature before production training
# - All Baguettotron features (thinking tags, RAG, multilingual)
# - All optimization modes (gradient checkpointing, schedulers)
# - All monitoring (TensorBoard, W&B optional)
# - Checkpoint resume capability

# ============================================================================
# MODEL CONFIGURATION (Full 321M)
# ============================================================================
model:
  config: "321m"

  # No overrides - test full model
  # 80 layers, 576 hidden, 9 heads, 3 KV heads, 1536 intermediate

# ============================================================================
# DATASET CONFIGURATION (Multiple datasets - ALL FEATURES)
# ============================================================================
data:
  # Test multi-dataset support
  datasets:
    - name: "smoke_test_main"
      weight: 0.4
      path: "data/smoke_test.json"
      max_samples: null       # Use all samples

    - name: "smoke_test_secondary"
      weight: 0.3
      path: "data/smoke_test_valid.json"
      max_samples: null       # Use all samples

    # HuggingFace dataset (tests HF integration)
    # First run: ~30-45 seconds for tokenization (with progress bar)
    # Subsequent runs: instant (uses cache)
    - name: "wikipedia_en"
      source: "huggingface"
      dataset_name: "wikimedia/wikipedia"
      subset: "20231101.en"
      split: "train"
      weight: 0.3
      max_samples: 100              # ⚡ 100 samples = ~30s first run, then instant
      # For stress test: increase to 1000 (3-4 min) or 10000 (30-40 min)

  # Context and sequence settings
  max_length: 1024            # Maximum sequence length
  block_size: 1024            # Alternative name (test both)
  max_seq_length: 1024        # Alternative name (test both)
  context_length: 1024        # Alternative name (test both)

  # DataLoader settings
  shuffle: true               # Shuffle training data
  num_workers: 4              # Number of data loading workers
  prefetch_factor: 2          # Batches to prefetch per worker
  pin_memory: true            # Pin memory for faster transfer
  persistent_workers: true    # Keep workers alive between epochs
  drop_last: false            # Drop last incomplete batch

  # Batch settings
  per_device_train_batch_size: 4  # Batch size per device
  per_device_eval_batch_size: 2   # Eval batch size per device
  train_batch_size: 4         # Alternative name (test both)
  eval_batch_size: 2          # Alternative name (test both)

  # Advanced data settings
  max_train_samples: null     # Limit training samples (null = all)
  max_eval_samples: null      # Limit evaluation samples (null = all)
  max_val_samples: null       # Alternative name (test both)
  max_predict_samples: null   # Limit prediction samples

  # Data sampling
  sampling_strategy: "weighted"  # Sampling strategy: weighted, balanced, sequential
  oversampling_factor: 1.0    # Oversampling factor for minority classes
  undersampling_factor: 1.0   # Undersampling factor for majority classes

  # Data augmentation
  augmentation: false         # Enable data augmentation
  noise_level: 0.0            # Noise level for augmentation

  # Test preprocessing
  preprocessing:
    remove_code: false        # Remove code blocks from text
    multilingual: true        # Enable multilingual preprocessing
    languages: ["fr", "en"]   # Languages to support
    lowercase: false          # Convert to lowercase
    remove_punctuation: false # Remove punctuation
    normalize_whitespace: true  # Normalize whitespace
    max_length: 1024          # Maximum length after preprocessing

# ============================================================================
# TRAINING HYPERPARAMETERS (Full Features - ALL PARAMETERS)
# ============================================================================
training:
  # Epochs and steps
  epochs: 1                   # Alternative: max_epochs
  max_epochs: 1               # Alternative name (test both)
  max_steps: 200              # Maximum training steps (overrides epochs)

  # Batch configuration
  batch_size: 4               # Moderate batch
  gradient_accumulation_steps: 8  # Effective batch = 32
  accum_steps: 8              # Alternative name (test both)

  # Learning rate and scheduler
  learning_rate: 1.0e-4       # Main LR parameter
  lr: 1.0e-4                  # Alternative name (test both)
  initial_learning_rate: 1.0e-4  # Alternative name (test both)

  # Scheduler configuration
  lr_scheduler: "cosine"      # Scheduler type: cosine, linear, constant, polynomial, inverse_sqrt
  scheduler: "cosine"         # Alternative name (test both)
  lr_scheduler_type: "cosine"  # Alternative name (test both)

  # Warmup configuration
  warmup_steps: 20            # Number of warmup steps
  num_warmup_steps: 20        # Alternative name (test both)
  warmup_ratio: null          # Alternative: ratio of total steps (0.1 = 10% warmup)

  # Learning rate bounds
  min_lr: 1.0e-6              # Minimum LR for cosine/polynomial schedulers
  max_lr: null                # Maximum LR (null = use learning_rate)
  learning_rate_min: 1.0e-6   # Alternative name (test both)
  learning_rate_max: null     # Alternative name (test both)

  # Scheduler-specific parameters
  scheduler_power: 1.0        # Power for polynomial scheduler
  scheduler_cycles: 0.5       # Number of cycles for cosine with restarts
  scheduler_restart_warmup_steps: 0  # Warmup after each restart
  scheduler_eta_min: 0.0      # Minimum LR for some schedulers

  # Optimizer configuration
  optimizer: "adamw"          # Optimizer type: adamw, adam, sgd, adagrad, rmsprop
  optim: "adamw"              # Alternative name (test both)

  # Weight decay and regularization
  weight_decay: 0.1           # Weight decay (L2 regularization)
  l2_regularization: 0.1      # Alternative name (test both)

  # Gradient clipping
  max_grad_norm: 1.0          # Maximum gradient norm for clipping
  grad_clip: 1.0              # Alternative name (test both)
  gradient_clip_val: 1.0      # Alternative name (test both)
  gradient_clip_algorithm: "norm"  # Clipping algorithm: norm, value

  # Adam/AdamW optimizer parameters
  adam_beta1: 0.9             # Adam beta1 (momentum)
  adam_beta2: 0.95            # Adam beta2 (RMSprop momentum)
  adam_epsilon: 1.0e-8        # Adam epsilon (numerical stability)
  betas: [0.9, 0.95]          # Alternative: beta tuple
  eps: 1.0e-8                 # Alternative name for epsilon

  # AdamW-specific
  adamw_decay_bias: false     # Apply weight decay to bias parameters
  adamw_correct_bias: true    # Correct bias in Adam

  # SGD-specific parameters
  sgd_momentum: 0.9           # SGD momentum
  sgd_dampening: 0.0          # SGD dampening
  sgd_nesterov: false         # Use Nesterov momentum

  # Precision
  mixed_precision: "bf16"     # Mixed precision training
  amp: "bf16"                 # Alternative name (test both)
  amp_dtype: "bf16"           # Alternative name (test both)
  precision: "bf16"           # Alternative name (test both)

  # Intervals and logging
  logging_steps: 10           # Log metrics every N steps
  log_interval: 10            # Alternative name (test both)
  log_every: 10               # Alternative name (test both)
  eval_steps: 50              # Evaluate every N steps
  eval_interval: 50           # Alternative name (test both)
  eval_every: 50              # Alternative name (test both)
  save_steps: 50              # Save checkpoint every N steps
  save_interval: 50           # Alternative name (test both)
  save_every: 50              # Alternative name (test both)

  # Checkpoint management
  save_total_limit: 3         # Keep N most recent checkpoints
  keep_last_checkpoints: 3    # Alternative name (test both)
  output_dir: "outputs/baguettotron_321m_smoke_test_full"

  # Context length
  block_size: 1024            # Maximum sequence length
  max_length: 1024            # Alternative name (test both)

  # Device configuration
  device: "cuda"              # Training device
  num_gpus: 1                 # Number of GPUs (for info only)

  # Distributed training (single GPU but test config)
  distributed: false          # Enable distributed training
  distributed_backend: "nccl" # Backend for distributed training
  world_size: 1               # Total number of processes
  local_rank: null            # Local rank (for DDP)
  global_rank: null           # Global rank (for DDP)
  master_addr: "localhost"    # Master node address
  master_port: "29500"        # Master node port

  # Compilation and optimization
  use_compile: false          # torch.compile (PyTorch 2.0+)
  compile: false              # Alternative name (test both)
  grad_checkpointing: true    # Gradient checkpointing (memory optimization)
  gradient_checkpointing: true  # Alternative name (test both)

  # Additional training settings
  resume_from_checkpoint: null  # Path to checkpoint to resume from
  dataloader_num_workers: 4   # Number of dataloader workers
  num_workers: 4              # Alternative name (test both)
  dataloader_pin_memory: true # Pin memory for faster data transfer
  pin_memory: true            # Alternative name (test both)
  seed: 42                    # Random seed for reproducibility

# ============================================================================
# CHECKPOINT MANAGEMENT (Full Test)
# ============================================================================
checkpoint:
  # Checkpoint saving intervals
  save_steps: 50              # Save checkpoint every N steps
  save_interval: 50           # Alternative name (test both)
  save_every: 50              # Alternative name (test both)

  # Checkpoint retention
  save_total_limit: 3         # Keep N most recent checkpoints
  keep_last_checkpoints: 3    # Alternative name (test both)

  # Output directory
  output_dir: "outputs/baguettotron_321m_smoke_test_full"
  checkpoint_dir: "outputs/baguettotron_321m_smoke_test_full/checkpoints"  # Alternative

  # Checkpoint format and content
  save_safetensors: true      # Save in SafeTensors format (recommended)
  save_optimizer_states: true # TEST OPTIMIZER STATE SAVING (for resume)
  save_scheduler_states: true # Save scheduler states (for resume)
  save_rng_states: true       # Save random number generator states

  # Checkpoint loading
  resume_from_checkpoint: null  # Path to checkpoint to resume from
  load_optimizer_states: true # Load optimizer states when resuming
  load_scheduler_states: true # Load scheduler states when resuming

  # Best model tracking
  save_best_model: true       # Save best model based on eval metric
  metric_for_best_model: "loss"  # Metric to track for best model
  greater_is_better: false    # Lower loss is better

# ============================================================================
# EVALUATION (Comprehensive)
# ============================================================================
evaluation:
  # Evaluation dataset
  eval_dataset: "data/smoke_test_valid.json"
  eval_data: "data/smoke_test_valid.json"  # Alternative name (test both)
  validation_file: "data/smoke_test_valid.json"  # Alternative name

  # Evaluation batch size
  eval_batch_size: 2          # Batch size for evaluation
  per_device_eval_batch_size: 2  # Alternative name (test both)

  # Evaluation frequency
  eval_steps: 50              # Evaluate every N steps
  eval_interval: 50           # Alternative name (test both)
  evaluation_strategy: "steps"  # Evaluation strategy: steps, epoch, no

  # Evaluation timing
  evaluate_at_start: true     # Test pre-training eval (baseline)
  evaluate_at_end: true       # Test post-training eval (final)
  do_eval: true               # Enable evaluation

  # Metrics computation
  compute_metrics: true       # Compute additional metrics
  metrics: ["loss", "perplexity", "accuracy"]  # Metrics to compute
  include_inputs_for_metrics: false  # Include inputs in metrics computation

  # Evaluation limits
  max_eval_samples: null      # Limit evaluation samples (null = all)
  eval_accumulation_steps: null  # Accumulate eval before moving to CPU

# ============================================================================
# GENERATION TESTS (Multilingual + Features)
# ============================================================================
generation:
  # Test prompts
  test_prompts:
    # English prompts
    - "Hello world"
    - "What is artificial intelligence?"
    - "The quick brown fox"

    # French prompts (test multilingual)
    - "Bonjour le monde"
    - "Qu'est-ce que l'intelligence artificielle ?"
    - "Le renard brun rapide"

    # Reasoning prompts (with thinking tags if supported)
    - "Calculate 15 × 23 step by step"
    - "Solve: 2x + 5 = 13"

    # Creative prompts
    - "Write a short poem about"

  # Generation parameters
  max_new_tokens: 100         # Maximum tokens to generate
  max_length: null            # Alternative: total sequence length
  min_length: 0               # Minimum tokens to generate
  min_new_tokens: 0           # Minimum new tokens to generate

  # Sampling parameters
  do_sample: true             # Enable sampling (vs greedy)
  temperature: 0.7            # Sampling temperature (0 = greedy)
  top_k: 50                   # Top-K sampling
  top_p: 0.9                  # Nucleus (top-p) sampling
  repetition_penalty: 1.0     # Repetition penalty (1.0 = no penalty)
  length_penalty: 1.0         # Length penalty for beam search
  no_repeat_ngram_size: 0     # Block repeated n-grams (0 = disabled)

  # Beam search parameters
  num_beams: 1                # Number of beams (1 = no beam search)
  num_beam_groups: 1          # Number of beam groups for diverse beam search
  diversity_penalty: 0.0      # Diversity penalty for diverse beam search
  early_stopping: false       # Stop beam search when num_beams sentences finish

  # Special tokens
  pad_token_id: null          # Padding token ID (null = use model config)
  bos_token_id: null          # Beginning-of-sequence token ID
  eos_token_id: null          # End-of-sequence token ID

  # Generation frequency
  test_every_n_steps: 50      # Test generation every N steps (4 times: 50, 100, 150, 200)
  generate_at_start: true     # Generate before training (baseline)
  generate_at_end: true       # Generate after training (final)

# ============================================================================
# MONITORING (Full Monitoring)
# ============================================================================
monitoring:
  # TensorBoard configuration
  use_tensorboard: true       # Enable TensorBoard logging
  tensorboard: true           # Alternative name (test both)
  tensorboard_dir: "runs/smoke_test_full"  # TensorBoard log directory
  tb_log_dir: "runs/smoke_test_full"  # Alternative name (test both)

  # Weights & Biases (W&B) configuration
  use_wandb: false            # Set to true to test W&B integration (requires login)
  wandb: false                # Alternative name (test both)
  wandb_project: "baguettotron-smoke-test"  # W&B project name
  wandb_run_name: "full-smoke-test"  # W&B run name
  wandb_entity: null          # W&B entity (team/user, null = default)
  wandb_tags: ["smoke-test", "full-pipeline", "321m"]  # W&B tags
  wandb_notes: "Comprehensive smoke test with all features"  # W&B notes
  wandb_group: "smoke-tests"  # W&B group for organizing runs
  wandb_job_type: "train"     # W&B job type
  wandb_mode: "online"        # W&B mode: online, offline, disabled
  wandb_dir: "outputs/wandb"  # W&B output directory

  # MLflow configuration
  use_mlflow: false           # Enable MLflow tracking
  mlflow: false               # Alternative name (test both)
  mlflow_tracking_uri: null   # MLflow tracking server URI (null = local)
  mlflow_experiment_name: "baguettotron-smoke-test"  # MLflow experiment name
  mlflow_run_name: "full-smoke-test"  # MLflow run name
  mlflow_tags: {}             # MLflow tags dictionary

  # Comprehensive metric logging
  log_learning_rate: true     # Log learning rate at each step
  log_gradient_norm: true     # Log gradient norm (for debugging)
  log_parameter_norm: true    # Log parameter norm (for monitoring)
  log_gpu_memory: true        # Log GPU memory usage
  log_cpu_memory: false       # Log CPU memory usage
  log_system_metrics: true    # Log system metrics (CPU, RAM, etc.)
  log_model_architecture: true  # Log model architecture once

  # Logging frequency
  logging_first_step: true    # Log first step metrics
  logging_steps: 10           # Log every N steps
  logging_nan_inf_filter: true  # Filter NaN/Inf from logs

  # Experiment tracking
  run_name: "full-smoke-test"  # General run name
  experiment_name: "baguettotron-smoke-test"  # Experiment name
  tags: ["smoke-test", "full"]  # General tags

# ============================================================================
# HARDWARE OPTIMIZATION (Test All Features)
# ============================================================================
hardware:
  # Memory optimization
  gradient_checkpointing: true   # Gradient checkpointing (trade compute for memory)
  grad_checkpointing: true       # Alternative name (test both)
  empty_cache_steps: 100         # Empty CUDA cache every N steps
  max_memory_allocated: null     # Maximum memory to allocate (null = unlimited)

  # Compilation and optimization
  torch_compile: false           # torch.compile (PyTorch 2.0+)
  compile: false                 # Alternative name (test both)
  compile_mode: "default"        # Compile mode: default, reduce-overhead, max-autotune
  dynamo_backend: "inductor"     # TorchDynamo backend

  # Mixed precision backend
  amp_backend: "native"          # AMP backend: native, apex
  fp16_backend: "native"         # Alternative name (test both)
  fp16_opt_level: "O1"           # Apex optimization level (if using apex)

  # DataLoader optimization
  pin_memory: true               # Pin memory for faster CPU->GPU transfer
  persistent_workers: true       # Keep dataloader workers alive
  prefetch_factor: 2             # Number of batches to prefetch per worker
  num_workers: 4                 # Number of dataloader workers
  dataloader_drop_last: false    # Drop last incomplete batch

  # CUDA optimization
  cudnn_benchmark: true          # Enable cuDNN benchmarking (faster but non-deterministic)
  cudnn_deterministic: false     # Enable deterministic cuDNN (slower but reproducible)
  tf32: true                     # Enable TensorFloat-32 on Ampere+ GPUs
  allow_tf32: true               # Alternative name (test both)

  # Device management
  device: "cuda"                 # Device to use: cuda, cpu, mps
  device_map: null               # Device map for model parallelism
  local_rank: -1                 # Local rank for distributed training

  # Multi-GPU settings
  parallel_mode: null            # Parallel mode: DataParallel, DistributedDataParallel
  n_gpu: 1                       # Number of GPUs to use

  # Memory management
  gradient_accumulation_steps: 8  # Accumulate gradients over N steps
  max_memory: null               # Maximum memory per GPU (dict or str)

  # Performance profiling
  profile: false                 # Enable PyTorch profiler
  profile_steps: null            # Steps to profile (e.g., [5, 10])
  profile_memory: false          # Profile memory usage

  # Debugging
  detect_anomaly: false          # Enable anomaly detection (slow)

# ============================================================================
# SPECIAL FEATURES (ALL ENABLED)
# ============================================================================
special_features:
  # Chat template
  use_chat_template: true

  # Thinking tags (TEST)
  enable_thinking_tags: true    # ✅ ENABLED
  thinking_mode: "always"

  # RAG features (TEST)
  enable_rag_tags: true          # ✅ ENABLED
  max_sources: 5
  enable_citations: true

  # Multilingual (TEST)
  languages: ["fr", "en"]        # ✅ TEST BOTH
  language_detection: true

  # Specialized tasks (TEST)
  enable_wikipedia_memorization: true
  enable_arithmetic_reasoning: true
  enable_text_editing: true
  enable_creative_writing: true

  # Control tokens (TEST)
  control_tokens: ["→", "↺", "※", "?maybe?", "●", "◐", "○", "⚠", "☐", "☑", "✓"]
  entropy_tokens: true

# ============================================================================
# TOKENIZER CONFIGURATION
# ============================================================================
tokenizer:
  type: "baguettotron"
  vocab_size: 65536
  chat_template_path: "assets/chat_template.json"

# ============================================================================
# LOGGING CONFIGURATION (Alternative to monitoring)
# ============================================================================
log:
  # Weights & Biases
  wandb: false                # Disabled for smoke test
  project: "baguettotron-smoke-test"
  run_name: "full-smoke-test"

  # TensorBoard
  tensorboard: true
  tensorboard_dir: "runs/smoke_test_full"

  # Debug options
  debug_checkpoints: false

# ============================================================================
# REPRODUCIBILITY
# ============================================================================
reproducibility:
  seed: 42
  deterministic: false
  benchmark: true

# ============================================================================
# FULL SMOKE TEST - WHAT IS TESTED
# ============================================================================
#
# 🎯 PURPOSE: Test EVERY possible feature and parameter before production training
#
# ✅ CORE PIPELINE:
# - Model loading (321M params with preset config)
# - Data loading (multi-dataset: local + HuggingFace)
# - Training loop (200 steps with max_steps)
# - Gradient accumulation (8 steps)
# - Mixed precision (BF16)
# - Optimizer (AdamW with all parameters)
# - Loss computation and backpropagation
# - Evaluation (comprehensive metrics)
# - Generation (multilingual with beam search params)
# - Checkpointing (with optimizer/scheduler/RNG states)
#
# ✅ TRAINING FEATURES:
# - All scheduler types: cosine with warmup, min_lr, cycles
# - All optimizer parameters: AdamW, Adam, SGD configs
# - Gradient checkpointing for memory optimization
# - All precision modes: bf16, fp16, amp backends
# - All logging intervals: steps, eval, save
# - Alternative parameter names for compatibility
# - Distributed training configuration (single GPU test)
# - Compilation options (torch.compile)
#
# ✅ DATA FEATURES:
# - Multi-dataset loading (3 datasets with weights)
# - HuggingFace integration (Wikipedia)
# - Local dataset loading (tokenized JSON)
# - All DataLoader parameters: workers, prefetch, pin_memory
# - All batch configurations: train, eval, per_device
# - Data preprocessing: multilingual, normalization
# - Sampling strategies: weighted, balanced
# - Context lengths: 1024 tokens
#
# ✅ CHECKPOINT FEATURES:
# - All save intervals: steps, total limit
# - SafeTensors format
# - Optimizer state persistence
# - Scheduler state persistence
# - RNG state persistence
# - Best model tracking with metrics
# - Resume from checkpoint capability
#
# ✅ EVALUATION FEATURES:
# - Multiple evaluation datasets
# - All evaluation strategies: steps, epoch
# - Evaluation at start and end
# - All metrics: loss, perplexity, accuracy
# - Evaluation accumulation steps
# - Max samples limiting
#
# ✅ GENERATION FEATURES:
# - Multilingual prompts (EN + FR)
# - Reasoning prompts (math, logic)
# - All sampling parameters: temperature, top_k, top_p
# - Beam search parameters: num_beams, diversity
# - Repetition and length penalties
# - Special token configuration
# - Generation at multiple checkpoints
#
# ✅ MONITORING FEATURES:
# - TensorBoard: full configuration
# - Weights & Biases: complete setup (disabled for test)
# - MLflow: tracking configuration
# - All metric logging: LR, gradients, parameters, memory
# - System metrics: CPU, GPU, RAM
# - Experiment tracking: tags, notes, groups
#
# ✅ HARDWARE OPTIMIZATION:
# - Gradient checkpointing (memory vs compute trade-off)
# - CUDA cache management
# - cuDNN benchmarking and determinism
# - TensorFloat-32 (TF32) on Ampere GPUs
# - torch.compile with different modes
# - DataLoader optimizations: persistent workers, prefetch
# - Memory profiling and anomaly detection
# - Multi-GPU configuration (for future scaling)
#
# ✅ SPECIAL BAGUETTOTRON FEATURES:
# - Chat template integration
# - Thinking tags: <think>...</think>
# - RAG tags: <source_1> to <source_5>
# - Citations and sources
# - Multilingual support: FR + EN
# - Language detection
# - Wikipedia memorization
# - Arithmetic reasoning
# - Text editing capabilities
# - Creative writing
# - Control tokens: →, ↺, ※, ?maybe?, ●, ◐, ○, ⚠, ☐, ☑, ✓
# - Entropy tokens
#
# ✅ REPRODUCIBILITY:
# - Random seed setting
# - Deterministic options
# - Benchmark mode
# - RNG state persistence
#
# 📊 CONFIGURATION COVERAGE:
# - Total parameters tested: 150+ YAML keys
# - Alternative parameter names: 40+ aliases tested
# - Model configurations: preset loading tested
# - Scheduler types: 5 types configured
# - Optimizer types: 3 types configured
# - Precision modes: 3 modes configured
# - Monitoring backends: 3 backends configured
#
# ============================================================================
# USAGE
# ============================================================================
#
# 1. CREATE TEST DATASETS
# ```bash
# mkdir -p data
# python << EOF
# import json
#
# # Main dataset (100 examples, multilingual)
# with open("data/smoke_test.json", "w") as f:
#     for i in range(50):
#         # English examples
#         text = f"This is test example {i}. Testing Baguettotron-321M."
#         json.dump({"text": text}, f)
#         f.write("\n")
#     for i in range(50):
#         # French examples
#         text = f"Ceci est l'exemple de test {i}. Test du Baguettotron-321M."
#         json.dump({"text": text}, f)
#         f.write("\n")
#
# # Validation dataset (20 examples)
# with open("data/smoke_test_valid.json", "w") as f:
#     for i in range(20):
#         text = f"Validation example {i}. Testing model."
#         json.dump({"text": text}, f)
#         f.write("\n")
# EOF
# ```
#
# 2. RUN FULL SMOKE TEST
# ```bash
# ./baguettotron train --config-file configs/train_321m_smoke_test_full.yaml
# ```
#
# 3. EXPECTED DURATION
# - 200 steps with full features: ~20-30 minutes
# - With gradient checkpointing: ~25-35 minutes
#
# 4. SUCCESS CRITERIA
# All features must work without errors:
# ✓ Cosine scheduler adjusts LR properly
# ✓ Gradient checkpointing reduces memory
# ✓ Multi-dataset loads and mixes correctly
# ✓ Multilingual text processes correctly
# ✓ Thinking tags are recognized
# ✓ RAG tags are processed
# ✓ Control tokens work
# ✓ Checkpoints save with optimizer states
# ✓ Generation works in both languages
# ✓ All monitoring metrics logged
# ✓ No OOM, no NaN, no crashes
#
# ============================================================================
# WHEN TO USE
# ============================================================================
#
# Use train_321m_smoke_test.yaml when:
# - Quick verification (5-10 min)
# - Testing basic setup
# - CI/CD pipeline
# - After minor code changes
#
# Use train_321m_smoke_test_full.yaml when:
# - Before production training
# - After major feature additions
# - Testing all Baguettotron capabilities
# - Verifying hardware setup completely
# - Before multi-hour/day training runs
#
# ============================================================================
# MEMORY USAGE
# ============================================================================
#
# Configuration: Batch 4, Context 1024, Gradient Checkpointing ON
# - Model: ~640 MB
# - Optimizer: ~1.9 GB
# - Activations (with checkpointing): ~4-6 GB
# - Gradients: ~640 MB
# - TOTAL: ~8-10 GB / 24 GB
# - Margin: 14-16 GB ✓✓
#
