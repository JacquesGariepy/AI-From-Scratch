# Configuration pour reprendre l'entraînement
# Usage: python scripts/train.py --config config/train_321m_resume.yaml --checkpoint outputs/test_321m/ckpt_364000

# === MODEL ===
model:
  config: "321m"

# === DATA ===
data:
  train_data: "data/wikipedia_simple_tokens.json"

# === TRAINING ===
training:
  # Hyperparamètres (mêmes que l'entraînement original)
  epochs: 5
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1e-4
  weight_decay: 0.1
  max_grad_norm: 1.0

  scheduler: "cosine"
  warmup_steps: 1000

  block_size: 512

  # Performance
  mixed_precision: true
  use_compile: true

  # Checkpointing
  save_interval: 1000
  save_total_limit: 5

  # Logging
  eval_interval: 1000
  log_interval: 10

  # Output (même répertoire pour continuer)
  output_dir: "outputs/test_321m"

seed: 42
device: "cuda"
