# Baguettotron-321M Fast Training Configuration for RTX 3090
# Optimized for quick experimentation and testing (higher throughput)

# Model Configuration
model:
  config: "321m"
  vocab_size: 65536
  hidden_size: 576
  num_hidden_layers: 80
  num_attention_heads: 9
  num_key_value_heads: 3
  intermediate_size: 1536
  max_position_embeddings: 4096
  rope_theta: 10000.0
  rope_scaling: null
  rms_norm_eps: 1.0e-05
  attention_dropout: 0.0
  hidden_dropout: 0.0
  tie_word_embeddings: true

# Training Configuration - Maximum Speed
training:
  train_data: "data/train_tokens.json"

  # Aggressive Batch Size for Speed
  batch_size: 48  # Push RTX 3090 to the limit
  gradient_accumulation_steps: 2  # Effective batch = 48 * 2 = 96
  max_seq_length: 768  # Shorter sequences = faster training

  # Shorter Training for Testing
  num_epochs: 10
  max_steps: 50000  # 50K steps for quick experiments

  # Learning Rate
  learning_rate: 5.0e-4  # Slightly higher for faster convergence
  warmup_steps: 1000  # Shorter warmup
  lr_scheduler: "cosine"
  min_lr_ratio: 0.1

  # Optimizer
  optimizer: "adamw"
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0

  # Mixed Precision - FP16 for maximum speed
  mixed_precision: "fp16"  # FP16 slightly faster than BF16 on RTX 3090

  # Memory Optimization - Minimal for speed
  gradient_checkpointing: false  # Disabled for maximum speed
  use_flash_attention: false

  # Compilation - Maximum Performance
  compile: true
  compile_mode: "max-autotune"  # Most aggressive optimization

# Checkpointing - Less Frequent
checkpointing:
  output_dir: "outputs/rtx3090_321m_fast"
  save_steps: 10000  # Save every 10K steps
  save_total_limit: 2  # Keep only 2 checkpoints
  resume_from_checkpoint: null

# Logging - Less Frequent
logging:
  log_level: "warning"  # Less logging overhead
  log_steps: 500  # Log every 500 steps
  eval_steps: 5000

  use_wandb: false
  use_tensorboard: true
  tensorboard_dir: "runs/rtx3090_321m_fast"

# Evaluation
evaluation:
  eval_data: null
  eval_batch_size: 32
  eval_accumulation_steps: 1

# Hardware Configuration
hardware:
  device: "cuda"
  num_workers: 8  # More workers for faster data loading
  pin_memory: true
  distributed: false
  world_size: 1
  local_rank: 0

# Data Loading - Optimized for Speed
data:
  shuffle: true
  drop_last: true
  prefetch_factor: 4  # Higher prefetch for speed
  persistent_workers: true

# Seed
seed: 42

# RTX 3090 Maximum Performance
performance:
  allow_tf32: true  # Essential for speed
  cudnn_benchmark: true  # Auto-tune for speed
  empty_cache_steps: 500  # Less frequent cache clearing
  max_split_size_mb: 512

# Advanced Settings
advanced:
  use_packing: false
  packing_factor: 1.0
  attn_implementation: "sdpa"  # Fastest for RTX 3090
  tokenizer_type: "auto"

# Expected Performance:
# ====================
# - Speed: ~4-5 steps/sec (vs ~2.5-3 with grad_checkpointing)
# - 50K steps in ~3-4 hours
# - Memory: ~21-23GB VRAM
# - Quality: Slightly lower than production config (shorter sequences, less checkpointing)
#
# Best For:
# - Quick experiments and prototyping
# - Hyperparameter tuning
# - Testing new features
# - Fast iteration cycles
#
# If OOM:
# - Reduce batch_size to 40 or 32
# - Reduce max_seq_length to 512
# - Enable gradient_checkpointing (at cost of 20% speed)
