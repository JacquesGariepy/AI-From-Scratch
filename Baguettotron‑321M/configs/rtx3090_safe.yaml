# Optimized configuration for RTX 3090 (24GB VRAM)
# Memory-safe settings with gradient accumulation for effective larger batches

model:
  # Use tiny model for initial training
  vocab_size: 512
  hidden_size: 64
  num_hidden_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  intermediate_size: 256
  max_position_embeddings: 512

training:
  # Memory-optimized settings
  batch_size: 1                    # Small batch to prevent OOM
  gradient_accumulation_steps: 32  # Effective batch = 1 * 32 = 32
  max_epochs: 3

  # Sequence length (lower to save memory)
  block_size: 512                  # Reduced from 2048 to save memory

  # Optimization
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 100
  max_grad_norm: 1.0

  # Mixed precision for memory efficiency
  mixed_precision: true            # Use AMP for lower memory usage
  use_compile: false               # Disable torch.compile initially

  # Checkpointing
  save_interval: 500
  save_total_limit: 3              # Keep only 3 checkpoints to save disk
  eval_interval: 250
  log_interval: 10

  # Output
  output_dir: outputs/rtx3090_safe

dataset:
  # Dataset settings
  train_data: data/train.json
  pad_token_id: 0
  num_workers: 2                   # Reduce workers to save RAM
  pin_memory: true                 # Faster GPU transfer

# Memory monitoring
monitoring:
  check_memory_every: 50           # Check GPU memory every N steps
  max_memory_percent: 90           # Warn if GPU memory > 90%
