# Training config for RTX 3090 (24 GB VRAM)
# Tips:
# - Start with seq_len=1024 for stability. If memory allows, raise toward 2048.
# - Keep micro_batch_size=1 and use grad_accum to reach your effective batch size.
# - Enable gradient checkpointing in your environment if you add it to the model.
model:
  vocab_size: 65536
  d_model: 576
  n_layers: 80
  n_heads: 9
  n_kv_heads: 3
  mlp_hidden: 1536
  max_seq_len: 2048   # reduce to 1024 if OOM
  rope_theta: 10000
  tie_embeddings: true

train:
  micro_batch_size: 1
  grad_accum_steps: 16       # effective batch ~16 tokens sequences
  epochs: 1
  steps_per_epoch: 200       # keep small for local runs
  lr: 2.5e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 1000
  scheduler: cosine
  amp_dtype: bf16            # use fp16 if bf16 not stable on your 3090
  tf32: true
  seed: 123
  save_every_steps: 200

data:
  type: stub                 # set to "hf" to use tokenizer + JSONL (requires internet/files)
  seq_len: 1024              # try 2048 if memory allows
  tokenizer_name: PleIAs/Baguettotron
  sft_jsonl: data/sft.jsonl

runtime:
  device_map: auto
  compile: false
  log_interval: 10
