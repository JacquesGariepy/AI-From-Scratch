# Multi-Dataset Training Configuration
# Training with SYNTH + Wikipedia datasets

seed: 42
device: cuda

# Model configuration
model:
  config: "321m"

# Training configuration
train:
  epochs: 100
  batch_size: 32
  accum_steps: 4  # Effective batch = 32 × 4 = 128

  # Learning rate schedule
  lr: 3.0e-4
  warmup_steps: 2000
  scheduler: "cosine"
  grad_clip: 1.0
  weight_decay: 0.1

  # Checkpointing strategy
  save_steps: 1000
  save_total_limit: 5  # Keep only 5 latest checkpoints
  eval_every: 1000
  log_every: 50

  # Optimizations
  amp: true
  amp_dtype: "bf16"
  torch_compile: false

  # Output
  output_dir: "outputs/multi-dataset"

# Multi-dataset configuration
data:
  datasets: "synth,wikipedia"
  dataset_weights: "0.7,0.3"  # 70% SYNTH, 30% Wikipedia
